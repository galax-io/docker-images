version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Etc/UTC
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "02:20"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
