name: Galaxio Docker Images Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  BUILDKIT_VERSION: v0.30.0
  # SHA-256 of buildkit-v<VERSION>.linux-amd64.tar.gz — update when bumping BUILDKIT_VERSION.
  BUILDKIT_CHECKSUM: "2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d"

  BUILD_CONTEXT: .
  CACHE_REPOSITORY: galaxioteam/buildkit-cache
  GATLING_VERSION: 3.13.5
  GATLING_SBT_VERSION: 4.18.1
  SBT_VERSION: 1.11.3
  PICATINNY_VERSION: 1.12.3
  GALAXIO_CLI_VERSION: 0.6.1
  MAVEN_VERSION: 3.9.9
  GRADLE_VERSION: 8.10.2

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    outputs:
      last_tag: ${{ steps.bump.outputs.last_tag }}
      release_tag: ${{ steps.bump.outputs.tag }}
      release_version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version and create git tag
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force --prune

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            CURRENT_TAG="${GITHUB_REF_NAME}"
            LAST_TAG="$(git tag --sort=-version:refname --list 'v*' | grep -Fxv "${CURRENT_TAG}" | head -n 1 || true)"

            echo "last_tag=${LAST_TAG}" >> "${GITHUB_OUTPUT}"
            echo "tag=${CURRENT_TAG}" >> "${GITHUB_OUTPUT}"
            echo "version=${CURRENT_TAG#v}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' --first-parent 2>/dev/null || true)"
          echo "last_tag=${LAST_TAG}" >> "${GITHUB_OUTPUT}"

          RANGE="${LAST_TAG:+${LAST_TAG}..HEAD}"
          COMMITS="$(git log --pretty=format:%s ${RANGE})"
          BUMP="patch"

          if printf '%s\n' "${COMMITS}" | grep -Eiq 'BREAKING CHANGE|!:'; then
            BUMP="major"
          elif printf '%s\n' "${COMMITS}" | grep -Eiq '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          if [[ -z "${LAST_TAG}" ]]; then
            MAJOR=0
            MINOR=0
            PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          fi

          case "${BUMP}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "${NEXT_TAG}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"

            if [[ "${TAG_COMMIT}" == "${HEAD_COMMIT}" ]]; then
              :
            else
              while git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; do
                IFS='.' read -r MAJOR MINOR PATCH <<< "${NEXT_TAG#v}"
                PATCH=$((PATCH + 1))
                NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              done
            fi
          fi

          VERSION="${NEXT_TAG#v}"

          echo "tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          if ! git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            git tag -a "${NEXT_TAG}" -m "Release ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"
            # Tag push itself triggers build.yml via on.push.tags — no dispatch needed
          fi

  build-jdk:
    name: Build base-jdk ${{ matrix.java-version }}
    runs-on: ubuntu-24.04
    needs: prepare-release
    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up BuildKit
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/buildkit.tgz
          echo "${BUILDKIT_CHECKSUM}  /tmp/buildkit.tgz" | sha256sum -c -
          tmp_dir="$(mktemp -d)"
          tar -C "${tmp_dir}" -xzf /tmp/buildkit.tgz
          sudo install -m 0755 "${tmp_dir}/bin/buildctl" /usr/local/bin/buildctl
          sudo install -m 0755 "${tmp_dir}/bin/buildkitd" /usr/local/bin/buildkitd
          rm -rf "${tmp_dir}" /tmp/buildkit.tgz
          buildctl --version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.prepare-release.outputs.release_version }}"
          release_tag="${{ needs.prepare-release.outputs.release_tag }}"
          image_name="galaxioteam/base-jdk"
          dockerfile_path="java.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:base-jdk-${{ matrix.java-version }}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            image_tags="${{ matrix.java-version }}-${release_version}"$'\n'"${{ matrix.java-version }}-${release_tag}"
            base_version="${release_version}"
          else
            # Publish both the mutable :<java> tag and an immutable :<java>-<sha> tag.
            # Downstream build-gatling-chain jobs reference the SHA-tagged image to prevent
            # base-image drift when multiple workflow runs are in flight simultaneously.
            image_tags="${{ matrix.java-version }}"$'\n'"${{ matrix.java-version }}-${{ github.sha }}"
            base_version="${{ github.sha }}"
          fi

          build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION=${{ matrix.java-version }}'

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image with BuildKit
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

  build-gatling-chain:
    name: Build gatling-${{ matrix.tool }}-chain (java ${{ matrix.java-version }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - build-jdk
    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
        tool: ['sbt', 'maven', 'gradle']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up BuildKit
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/buildkit.tgz
          echo "${BUILDKIT_CHECKSUM}  /tmp/buildkit.tgz" | sha256sum -c -
          tmp_dir="$(mktemp -d)"
          tar -C "${tmp_dir}" -xzf /tmp/buildkit.tgz
          sudo install -m 0755 "${tmp_dir}/bin/buildctl" /usr/local/bin/buildctl
          sudo install -m 0755 "${tmp_dir}/bin/buildkitd" /usr/local/bin/buildkitd
          rm -rf "${tmp_dir}" /tmp/buildkit.tgz
          buildctl --version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare builder metadata
        id: builder-meta
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.prepare-release.outputs.release_version }}"
          release_tag="${{ needs.prepare-release.outputs.release_tag }}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"
          base_version="${release_version}"

          image_name="galaxioteam/gatling-${tool}-builder"
          dockerfile_path="gatling-${tool}-builder.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-builder-${java_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            image_tags="${java_version}-${release_version}"$'\n'"${java_version}-${release_tag}"
            base_version="${release_version}"
          else
            # Reference the SHA-tagged base-jdk image published by build-jdk in this same run.
            image_tags="${java_version}"$'\n'"${java_version}-${{ github.sha }}"
            base_version="${{ github.sha }}"
          fi

          case "${tool}" in
            sbt)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nSBT_VERSION='"${SBT_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"$'\nGATLING_SBT_VERSION='"${GATLING_SBT_VERSION}"$'\nPICATINNY_VERSION='"${PICATINNY_VERSION}"$'\nGALAXIO_CLI_VERSION='"${GALAXIO_CLI_VERSION}"
              ;;
            maven)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nMAVEN_VERSION='"${MAVEN_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"
              ;;
            gradle)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nGRADLE_VERSION='"${GRADLE_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"
              ;;
          esac

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push builder image
        env:
          IMAGE_NAME: ${{ steps.builder-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.builder-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.builder-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.builder-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.builder-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

      - name: Prepare runtime metadata
        id: runtime-meta
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.prepare-release.outputs.release_version }}"
          release_tag="${{ needs.prepare-release.outputs.release_tag }}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"

          builder_image="galaxioteam/gatling-${tool}-builder"
          image_name="galaxioteam/gatling-${tool}-runtime"
          dockerfile_path="gatling-runtime.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-runtime-${java_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            builder_version="${java_version}-${release_version}"
            image_tags="${java_version}-${release_version}"$'\n'"${java_version}-${release_tag}"
          else
            builder_version="${java_version}"
            image_tags="${java_version}"$'\n'"${java_version}-${{ github.sha }}"
          fi

          build_args=$'BUILDER_IMAGE='"${builder_image}"$'\nBUILDER_VERSION='"${builder_version}"$'\nBUILDER_TOOL='"${tool}"

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime image
        env:
          IMAGE_NAME: ${{ steps.runtime-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.runtime-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.runtime-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.runtime-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.runtime-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.runtime-meta.outputs.image_name }}:$(printf '%s' '${{ steps.runtime-meta.outputs.image_tags }}' | head -n1)"
          tests/test_runtime_smoke.sh "$IMAGE"

      - name: Prepare debug metadata
        id: debug-meta
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.prepare-release.outputs.release_version }}"
          release_tag="${{ needs.prepare-release.outputs.release_tag }}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"

          runtime_image="galaxioteam/gatling-${tool}-runtime"
          image_name="galaxioteam/gatling-${tool}-debug"
          dockerfile_path="gatling-debug.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-debug-${java_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            runtime_version="${java_version}-${release_version}"
            image_tags="${java_version}-${release_version}"$'\n'"${java_version}-${release_tag}"
          else
            runtime_version="${java_version}"
            image_tags="${java_version}"$'\n'"${java_version}-${{ github.sha }}"
          fi

          build_args=$'RUNTIME_IMAGE='"${runtime_image}"$'\nRUNTIME_VERSION='"${runtime_version}"

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push debug image
        env:
          IMAGE_NAME: ${{ steps.debug-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.debug-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.debug-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.debug-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.debug-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-24.04
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          fromTag: ${{ needs.prepare-release.outputs.last_tag }}
          toTag: ${{ needs.prepare-release.outputs.release_tag }}
          configuration: .github/changelog/release-changelog-builder.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    name: Update README with image sizes
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - build-jdk
      - build-gatling-chain
      - integration-tests
    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Update README badges and image sizes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          set -euo pipefail

          ./.github/scripts/update-readme.sh

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No README changes to commit"
            exit 0
          fi

          git add README.md
          git commit -m "docs: update image sizes and badges [skip ci]"
          git push

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - prepare-release
      - build-jdk
      - build-gatling-chain
      - integration-tests
      - changelog
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          body: |
            ${{ needs.changelog.outputs.changelog }}

            ## Docker images

            | Image | Java 17 | Java 21 |
            |-------|---------|---------|
            | `galaxioteam/base-jdk` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-sbt-builder` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-maven-builder` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-gradle-builder` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-sbt-runtime` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-maven-runtime` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-gradle-runtime` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-sbt-debug` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-maven-debug` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
            | `galaxioteam/gatling-gradle-debug` | `17-${{ needs.prepare-release.outputs.release_version }}` | `21-${{ needs.prepare-release.outputs.release_version }}` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
