name: Galaxio Docker Images Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

env:
  BUILDKIT_VERSION: v0.30.0
  BUILD_CONTEXT: .
  CACHE_REPOSITORY: galaxioteam/buildkit-cache
  GATLING_VERSION: 3.13.5
  GATLING_SBT_VERSION: 4.18.1
  SBT_VERSION: 1.11.3
  PICATINNY_VERSION: 1.12.3
  GALAXIO_CLI_VERSION: 0.6.1
  MAVEN_VERSION: 3.9.9
  GRADLE_VERSION: 8.10.2

# PR builds push images with SHA tags (never overwrites latest/version tags).

jobs:
  build-jdk:
    name: Build base-jdk ${{ matrix.java-version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up BuildKit
        run: |
          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/buildkit.tgz
          tmp_dir="$(mktemp -d)"
          tar -C "${tmp_dir}" -xzf /tmp/buildkit.tgz
          sudo install -m 0755 "${tmp_dir}/bin/buildctl" /usr/local/bin/buildctl
          sudo install -m 0755 "${tmp_dir}/bin/buildkitd" /usr/local/bin/buildkitd
          buildctl --version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          sha_tag="${GITHUB_SHA}"
          image_name="galaxioteam/base-jdk"
          dockerfile_path="java.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:base-jdk-${{ matrix.java-version }}-pr"
          image_tags="${{ matrix.java-version }}-${sha_tag}"
          # Base image (galaxioteam/galaxio) is external — built in galax-io/galaxio-cli repo
          build_args=$'BASE_VERSION=latest\nJAVA_VERSION=${{ matrix.java-version }}'

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image with BuildKit
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

  build-gatling-chain:
    name: Build gatling-${{ matrix.tool }}-chain (java ${{ matrix.java-version }})
    runs-on: ubuntu-24.04
    needs: build-jdk
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
        tool: ['sbt', 'maven', 'gradle']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up BuildKit
        run: |
          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/buildkit.tgz
          tmp_dir="$(mktemp -d)"
          tar -C "${tmp_dir}" -xzf /tmp/buildkit.tgz
          sudo install -m 0755 "${tmp_dir}/bin/buildctl" /usr/local/bin/buildctl
          sudo install -m 0755 "${tmp_dir}/bin/buildkitd" /usr/local/bin/buildkitd
          buildctl --version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare builder metadata
        id: builder-meta
        shell: bash
        run: |
          set -euo pipefail

          sha_tag="${GITHUB_SHA}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"

          image_name="galaxioteam/gatling-${tool}-builder"
          dockerfile_path="gatling-${tool}-builder.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-builder-${java_version}-pr"
          image_tags="${java_version}-${sha_tag}"
          # Use SHA-tagged base-jdk pushed by build-jdk job
          base_version="${sha_tag}"

          case "${tool}" in
            sbt)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nSBT_VERSION='"${SBT_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"$'\nGATLING_SBT_VERSION='"${GATLING_SBT_VERSION}"$'\nPICATINNY_VERSION='"${PICATINNY_VERSION}"$'\nGALAXIO_CLI_VERSION='"${GALAXIO_CLI_VERSION}"
              ;;
            maven)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nMAVEN_VERSION='"${MAVEN_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"
              ;;
            gradle)
              build_args=$'BASE_VERSION='"${base_version}"$'\nJAVA_VERSION='"${java_version}"$'\nGRADLE_VERSION='"${GRADLE_VERSION}"$'\nGATLING_VERSION='"${GATLING_VERSION}"
              ;;
          esac

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push builder image
        env:
          IMAGE_NAME: ${{ steps.builder-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.builder-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.builder-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.builder-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.builder-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

      - name: Prepare runtime metadata
        id: runtime-meta
        shell: bash
        run: |
          set -euo pipefail

          sha_tag="${GITHUB_SHA}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"

          builder_image="galaxioteam/gatling-${tool}-builder"
          # Use SHA-tagged builder pushed above (within this same job)
          builder_version="${java_version}-${sha_tag}"
          image_name="galaxioteam/gatling-${tool}-runtime"
          dockerfile_path="gatling-runtime.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-runtime-${java_version}-pr"
          image_tags="${java_version}-${sha_tag}"

          build_args=$'BUILDER_IMAGE='"${builder_image}"$'\nBUILDER_VERSION='"${builder_version}"$'\nBUILDER_TOOL='"${tool}"

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime image
        env:
          IMAGE_NAME: ${{ steps.runtime-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.runtime-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.runtime-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.runtime-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.runtime-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh

      - name: Prepare debug metadata
        id: debug-meta
        shell: bash
        run: |
          set -euo pipefail

          sha_tag="${GITHUB_SHA}"
          tool="${{ matrix.tool }}"
          java_version="${{ matrix.java-version }}"

          runtime_image="galaxioteam/gatling-${tool}-runtime"
          # Use SHA-tagged runtime pushed above (within this same job)
          runtime_version="${java_version}-${sha_tag}"
          image_name="galaxioteam/gatling-${tool}-debug"
          dockerfile_path="gatling-debug.Dockerfile"
          cache_ref="${CACHE_REPOSITORY}:gatling-${tool}-debug-${java_version}-pr"
          image_tags="${java_version}-${sha_tag}"

          build_args=$'RUNTIME_IMAGE='"${runtime_image}"$'\nRUNTIME_VERSION='"${runtime_version}"

          {
            echo "image_name=${image_name}"
            echo "dockerfile_path=${dockerfile_path}"
            echo "cache_ref=${cache_ref}"
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s\n' "${build_args}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push debug image
        env:
          IMAGE_NAME: ${{ steps.debug-meta.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.debug-meta.outputs.image_tags }}
          DOCKERFILE_PATH: ${{ steps.debug-meta.outputs.dockerfile_path }}
          CACHE_REF: ${{ steps.debug-meta.outputs.cache_ref }}
          BUILD_ARGS: ${{ steps.debug-meta.outputs.build_args }}
          CONTEXT_DIR: ${{ env.BUILD_CONTEXT }}
        run: ./.github/scripts/buildkit-build.sh
