name: ShellCheck

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
    paths:
      - '**/*.sh'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
          # The Spec Kit kit is generated in spec-kit-galaxio-bootstrap and shipped as it is.
          ignore_paths: .specify
